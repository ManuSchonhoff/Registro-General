<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tablero Semanal Financiera</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="robots" content="noindex, nofollow">
<style>
/* Una sección por vez: encabezado fijo arriba, barra inferior en el celular y riel izquierdo desde 960 px.
   Tinta para la interfaz; el color queda para los datos y los estados. */
:root {
  color-scheme: light;
  --bg: #f6f6f3; --surface: #fdfdfc; --surface-2: #efeee9;
  --ink: #121211; --ink-2: #4f4e4a; --ink-3: #6b6a65;
  --hair: #e3e2db; --axis: #c3c2b7; --focus: #2a78d6;
  --op-1: #eb6834; --op-2: #2a78d6; --op-resto: #199e70;
  --dato: #848fa3; --dato-foco: #2f4466; --banda: rgba(18,18,17,.10);
  --ord-1: #86b6ef; --ord-2: #3987e5; --ord-3: #256abf; --ord-4: #104281;
  --ok-ink: #006300; --warn-ink: #8a5a00; --crit: #d03b3b; --crit-ink: #b02a2a;
  --warn-bg: rgba(250,178,25,.12); --crit-bg: rgba(208,59,59,.08);
  --velo: rgba(18,18,17,.38); --sombra: rgba(18,18,17,.10);
  --font: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --head-h: 51px; --nav-h: 56px; --rail: 200px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0f0f0e; --surface: #1a1a19; --surface-2: #232321;
    --ink: #f0efec; --ink-2: #c3c2b7; --ink-3: #a3a29b;
    --hair: #2c2c2a; --axis: #383835; --focus: #5b9be6;
    --op-1: #d95926; --op-2: #3987e5; --op-resto: #199e70;
    --dato: #6b7890; --dato-foco: #c9d6ea; --banda: rgba(240,239,236,.14);
    --ord-1: #184f95; --ord-2: #2a6fc4; --ord-3: #5b9be6; --ord-4: #9ec5f4;
    --ok-ink: #0ca30c; --warn-ink: #fab219; --crit: #e66767; --crit-ink: #eb7575;
    --warn-bg: rgba(250,178,25,.14); --crit-bg: rgba(230,103,103,.14);
    --velo: rgba(0,0,0,.6); --sombra: rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0f0f0e; --surface: #1a1a19; --surface-2: #232321;
  --ink: #f0efec; --ink-2: #c3c2b7; --ink-3: #a3a29b;
  --hair: #2c2c2a; --axis: #383835; --focus: #5b9be6;
  --op-1: #d95926; --op-2: #3987e5; --op-resto: #199e70;
  --dato: #6b7890; --dato-foco: #c9d6ea; --banda: rgba(240,239,236,.14);
  --ord-1: #184f95; --ord-2: #2a6fc4; --ord-3: #5b9be6; --ord-4: #9ec5f4;
  --ok-ink: #0ca30c; --warn-ink: #fab219; --crit: #e66767; --crit-ink: #eb7575;
  --warn-bg: rgba(250,178,25,.14); --crit-bg: rgba(230,103,103,.14);
  --velo: rgba(0,0,0,.6); --sombra: rgba(0,0,0,.4);
}
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; scroll-padding-top: calc(env(safe-area-inset-top, 0px) + var(--head-h));
  scroll-padding-bottom: calc(var(--nav-h) + env(safe-area-inset-bottom, 0px)); }
body.hoja-abierta { overflow: hidden; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 var(--font);
  padding-bottom: calc(var(--nav-h) + env(safe-area-inset-bottom, 0px)); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.vh { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.gut { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.num, .t, .eje, .tab { font-variant-numeric: tabular-nums; }

/* Encabezado */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--hair); }
.top-in { height: var(--head-h); display: flex; align-items: center; gap: 8px; }
.top h1 { font-size: 15px; margin: 0; font-weight: 600; white-space: nowrap; }
@media (max-width: 959px) { .top .titulo { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); } }
.chip-sem { display: inline-flex; align-items: center; gap: 6px; min-height: 40px; max-width: 100%; padding: 0 12px; border: 1px solid var(--axis);
  border-radius: 20px; background: var(--surface); font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.chip-sem .est { font-weight: 400; color: var(--ink-2); }
.chip-sem .est-c { display: none; }
@media (max-width: 380px) { .chip-sem .est-l { display: none; } .chip-sem .est-c { display: inline; } }
.chip-sem svg { flex: none; }
.sp { flex: 1; }
.b-ic { flex: none; width: 44px; height: 44px; display: grid; place-items: center; border: 0; border-radius: 22px; background: transparent; color: var(--ink-2); text-decoration: none; font-weight: 700; font-size: 17px; }
.b-ic:hover { background: var(--surface-2); color: var(--ink); }

/* Navegación */
.nav { position: fixed; z-index: 20; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--hair);
  padding-bottom: env(safe-area-inset-bottom, 0px); display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); }
.nav button { min-height: var(--nav-h); border: 0; background: none; color: var(--ink-3); display: flex; flex-direction: column; align-items: center;
  justify-content: center; gap: 3px; font-size: 11px; letter-spacing: .02em; position: relative; padding: 0 2px; }
.nav button[aria-current="page"] { color: var(--ink); font-weight: 600; }
.nav button[aria-current="page"]::before { content: ""; position: absolute; top: 0; left: 25%; right: 25%; height: 2px; border-radius: 0 0 2px 2px; background: var(--ink); }

/* Contenido */
.main { padding-block: 8px 32px; }
.main-in { max-width: 1200px; margin: 0 auto; min-width: 0; }
.banner { padding: 6px 12px; margin-bottom: 10px; border-radius: 12px; background: var(--surface-2); font-size: 13px; color: var(--ink-2); }
.banner p { margin: 0; }
.banner b { color: var(--ink); }
.banner .link { font-weight: 600; margin-left: 4px; min-height: 28px; }
.banner .corto { display: none; }
/* En el celular el banner va en una línea y con poco aire: con él, la primera pantalla tiene que seguir mostrando las
   alertas y los indicadores 1 a 4. El "Ver" conserva un área táctil de 44 px con ::after. */
@media (max-width: 599px) {
  .banner .largo { display: none; } .banner .corto { display: inline; }
  .banner { padding: 0 10px; margin-bottom: 2px; }
  .banner .link { min-height: 26px; position: relative; }
  .banner .link::after { content: ""; position: absolute; inset: -9px -10px; }
  .main { padding-top: 4px; }
  .alertas.portada { gap: 6px; }
}
.anclas { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-block: 6px; margin-bottom: 4px; }
.anclas::-webkit-scrollbar { display: none; }
.mods > .anclas { grid-column: 1 / -1; margin: 0; min-width: 0; }
.chip { display: inline-flex; align-items: center; min-height: 32px; padding: 0 12px; border: 1px solid var(--hair); border-radius: 16px;
  font-size: 13px; color: var(--ink-2); background: var(--surface); white-space: nowrap; text-decoration: none; position: relative; flex: none; }
.chip::after { content: ""; position: absolute; inset: -6px 0; }
.chip:hover { color: var(--ink); border-color: var(--axis); }
.periodo { margin: 4px 0 12px; font-size: 13px; color: var(--ink-2); }
.link { border: 0; background: none; padding: 0; color: var(--ink); text-decoration: underline; text-underline-offset: 2px; font-size: inherit; min-height: 44px; }
.periodo .link { display: inline-flex; align-items: center; vertical-align: middle; }
.mods { display: grid; gap: 12px; grid-template-columns: minmax(0, 1fr); align-items: start; }

/* Módulos */
.mod { background: var(--surface); border: 1px solid var(--hair); border-radius: 12px; padding: 12px; position: relative; min-width: 0;
  scroll-margin-top: calc(env(safe-area-inset-top, 0px) + var(--head-h) + 12px); display: flex; flex-direction: column; gap: 10px; }
.mod.plano { background: none; border: 0; padding: 0; }
.mod-h { padding-right: 40px; min-height: 32px; display: flex; flex-direction: column; justify-content: center; }
.mod h2 { font-size: 17px; line-height: 1.3; margin: 0; font-weight: 600; text-wrap: balance; }
.mod h3 { font-size: 13px; margin: 0; font-weight: 600; color: var(--ink-2); text-transform: uppercase; letter-spacing: .04em; font-size: 11px; }
.mod-sub { margin: 0; font-size: 13px; color: var(--ink-2); }
.mod p { margin: 0; }
.nota { font-size: 13px; color: var(--ink-2); }
.vacio { font-size: 15px; color: var(--ink-2); padding: 8px 0; }
details.ayuda > summary { position: absolute; top: 8px; right: 8px; width: 32px; height: 32px; border-radius: 16px; border: 1px solid var(--axis);
  display: grid; place-items: center; list-style: none; cursor: pointer; font-weight: 700; font-size: 15px; color: var(--ink-2); background: var(--surface); }
.mod.plano details.ayuda > summary { top: 0; right: 0; }
details.ayuda > summary::after { content: ""; position: absolute; inset: -6px; }
details.ayuda > summary::-webkit-details-marker { display: none; }
details.ayuda[open] > summary { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.ayuda-txt { padding: 10px 12px; background: var(--surface-2); border-radius: 8px; font-size: 13px; color: var(--ink-2); }
.ayuda-txt .ay-l { color: var(--ink); font-size: 15px; margin: 0 0 6px; }
.ayuda-txt dl { margin: 0; display: grid; gap: 2px; }
.ayuda-txt dt { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; font-weight: 600; margin-top: 6px; color: var(--ink-3); }
.ayuda-txt dd { margin: 0; }

/* Alertas */
.alertas { display: grid; gap: 8px; list-style: none; margin: 0; padding: 0; }
.alerta { border-radius: 10px; background: var(--surface); border: 1px solid var(--hair); border-left: 4px solid var(--sev, var(--ink-3)); min-width: 0; }
.al-a { display: flex; align-items: center; gap: 4px; padding: 7px 6px 7px 10px; min-height: 44px; color: inherit; text-decoration: none; border-radius: 0 9px 9px 0; }
.al-a:hover .al-ch { color: var(--ink); }
.al-a p, .al-p { margin: 0; flex: 1; min-width: 0; font-size: 15px; line-height: 1.35; overflow-wrap: anywhere; }
.al-p { padding: 8px 10px; }
.al-sev { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: var(--sev, var(--ink-3)); margin-right: 6px; vertical-align: 1px; }
.al-ch { flex: none; color: var(--ink-3); }
.alerta.s-critico { --sev: var(--crit); background: var(--crit-bg); }
.alerta.s-critico .al-sev { color: var(--crit-ink); }
.alerta.s-atencion { --sev: var(--warn-ink); background: var(--warn-bg); }
.alerta.s-info { --sev: var(--ink-3); }
.alerta.revisada { --sev: var(--axis); background: var(--surface); }
.alerta.revisada .al-a p, .alerta.revisada .al-p { color: var(--ink-2); }
.alerta.revisada .al-sev { color: var(--ok-ink); }
.al-pie { display: flex; flex-wrap: wrap; gap: 2px 12px; align-items: center; font-size: 13px; padding: 0 10px 6px; }
.mod-h.fila { flex-direction: row; align-items: center; justify-content: space-between; gap: 8px; }
.mod-h.fila h2 { flex: 1; min-width: 0; }
.mod-h .al-fecha { font-size: 13px; font-weight: 400; color: var(--ink-2); margin-left: 6px; }
.ok-box { display: flex; gap: 10px; align-items: center; padding: 12px; border-radius: 10px; background: var(--surface); border: 1px solid var(--hair); color: var(--ok-ink); font-weight: 600; }
.ok-box span { color: var(--ink); }
.tag { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; padding: 1px 7px; border-radius: 10px; background: var(--surface-2); color: var(--ink-2);
  white-space: nowrap; text-transform: none; letter-spacing: 0; font-weight: 500; }
.tag.crit { color: var(--crit-ink); background: var(--crit-bg); }
.tag.warn { color: var(--warn-ink); background: var(--warn-bg); }
.tag.ok { color: var(--ok-ink); }
details.mini > summary { font-size: 13px; color: var(--ink-2); cursor: pointer; min-height: 44px; display: flex; align-items: center; gap: 4px; list-style: none; }
details.mini > summary::-webkit-details-marker { display: none; }
details.mini > summary::before { content: ""; width: 6px; height: 6px; border-right: 1.5px solid currentColor; border-bottom: 1.5px solid currentColor; transform: rotate(-45deg); margin: 0 4px 0 2px; flex: none; }
details.mini[open] > summary::before { transform: rotate(45deg); margin-top: -3px; }
details.mini > summary:hover { color: var(--ink); }
details.mini[open] > summary { color: var(--ink); }
.claves { margin: 4px 0 0; padding-left: 18px; font-size: 13px; color: var(--ink-2); }
.como { margin: 2px 0 0; font-size: 13px; color: var(--ink); }
.claves code { font-size: 12px; overflow-wrap: anywhere; color: var(--ink); }

/* Indicadores */
.inds { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
.ind { background: var(--surface); border: 1px solid var(--hair); border-radius: 12px; padding: 8px; position: relative; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.ind.crit { border-color: var(--crit); background: var(--crit-bg); }
.ind .k { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--ink-2); font-weight: 600; padding-right: 32px; min-height: 28px; display: flex; align-items: center; line-height: 1.25; }
.ind details.ayuda > summary { top: 6px; right: 6px; }
.ind details.ayuda[open] { margin: 4px 0; }
.ind .v { font-size: 28px; line-height: 1.1; font-weight: 650; letter-spacing: -.01em; overflow-wrap: anywhere; }
.ind .v .u { font-size: 15px; font-weight: 500; color: var(--ink-2); margin-right: 4px; letter-spacing: 0; }
.ind.compacta .v { font-size: 24px; }
.ind .v2 { font-size: 17px; line-height: 1.3; font-weight: 650; }
.ind .v2 .u { font-size: 13px; font-weight: 500; color: var(--ink-2); }
.ind .v2 .nw { white-space: nowrap; }
.ind .v2.crit-t { color: var(--crit-ink); }
.ind .v2 .u2 { font-size: 13px; font-weight: 500; color: var(--ink-2); white-space: nowrap; }
.ind .s, .ind .c { font-size: 13px; color: var(--ink-2); line-height: 1.35; overflow-wrap: anywhere; }
.ind .c { color: var(--ink-2); }
.ind .falta { color: var(--ink-3); }
.ind .spark { margin-top: auto; padding-top: 4px; }
.ind .spark svg { display: block; width: 100%; }
.ind a { color: var(--ink); text-underline-offset: 2px; }
.ind a.ver { display: inline-flex; align-items: center; min-height: 44px; margin-block: -10px -12px; }

/* Gráficos */
.graf { position: relative; width: 100%; min-width: 0; }
.graf svg { display: block; width: 100%; height: auto; touch-action: pan-y; }
.graf svg:focus-visible { outline-offset: 0; }
.eje text { fill: var(--ink-3); font-size: 11px; font-family: var(--font); }
.marca { fill: var(--ink-3); font-size: 11px; font-family: var(--font); paint-order: stroke; stroke: var(--surface); stroke-width: 3px; stroke-linejoin: round; }
.rot { font-size: 11px; font-family: var(--font); font-weight: 600; }
.lectura { min-height: 44px; display: flex; flex-wrap: wrap; align-items: center; gap: 2px 10px; padding: 6px 10px; border-radius: 8px;
  background: var(--surface-2); font-size: 13px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.lectura b { color: var(--ink); font-weight: 600; }
.lectura .lt { flex: 1 1 200px; min-width: 0; }
.lectura .btn { margin-left: auto; }
.ley { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 13px; color: var(--ink-2); align-items: center; }
.ley .it { display: inline-flex; align-items: center; gap: 6px; }
.sw { width: 10px; height: 10px; border-radius: 2px; display: inline-block; flex: none; }
.sw.redondo { border-radius: 50%; }
.sw.lin { height: 2px; width: 14px; border-radius: 1px; }
.sw.dash { height: 0; width: 14px; border-top: 2px dashed var(--ink-3); background: none !important; }
.sw.dash-dato { border-top-color: var(--dato); }
.sw.trama { background: repeating-linear-gradient(135deg, var(--dato) 0 2px, transparent 2px 5px); border: 1px solid var(--dato); }
.sw.trama-g { background: repeating-linear-gradient(135deg, var(--ink-3) 0 2px, transparent 2px 5px); border: 1px solid var(--ink-3); }
.btn { min-height: 36px; padding: 0 12px; border-radius: 18px; border: 1px solid var(--axis); background: var(--surface); font-size: 13px; color: var(--ink); white-space: nowrap; position: relative; }
.btn::after { content: ""; position: absolute; inset: -4px 0; }
.btn:hover { border-color: var(--ink-3); }
.mas { align-self: flex-start; }
details.vt > summary { font-size: 13px; color: var(--ink-2); cursor: pointer; min-height: 44px; display: inline-flex; align-items: center; text-decoration: underline; text-underline-offset: 2px; }
details.vt[open] > summary { color: var(--ink); }

/* Control segmentado */
.seg { display: inline-flex; background: var(--surface-2); border-radius: 10px; padding: 3px; gap: 2px; max-width: 100%; flex-wrap: wrap; }
.seg button { min-height: 44px; padding: 0 12px; border: 0; border-radius: 8px; background: transparent; color: var(--ink-2); font-size: 13px; white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); font-weight: 600; box-shadow: 0 1px 2px var(--sombra); }

/* Listas de barras */
.barras { list-style: none; margin: 0; padding: 0; display: grid; }
.barras li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 3px 10px; padding: 7px 0; border-top: 1px solid var(--hair); align-items: center; }
.barras li:first-child { border-top: 0; }
.barras .nom { grid-column: 1 / -1; font-size: 15px; overflow-wrap: anywhere; display: flex; gap: 6px; align-items: baseline; }
.barras .nom .pos { color: var(--ink-3); font-size: 13px; min-width: 1.6em; font-variant-numeric: tabular-nums; }
.barras .pista { height: 8px; border-radius: 2px; position: relative; min-width: 0; }
.barras .pista i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 2px; background: var(--dato); min-width: 2px; }
.barras li.click { cursor: pointer; }
.barras li.click:hover .nom > span:last-child { text-decoration: underline; text-underline-offset: 2px; }
.barras .tick { position: absolute; top: -3px; bottom: -3px; width: 2px; margin-left: -1px; background: var(--ink); border-radius: 1px; }
.barras .val { font-size: 13px; color: var(--ink-2); white-space: nowrap; font-variant-numeric: tabular-nums; display: flex; gap: 6px; align-items: center; }
.punto { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex: none; align-self: center; }
.dos { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); }
.buscar { display: flex; gap: 8px; align-items: center; }
.buscar input { flex: 1; min-width: 0; min-height: 44px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--axis); background: var(--bg); font-size: 16px; }

/* Cifras */
.cifras { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.cifra .k { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--ink-2); font-weight: 600; }
.cifra .v { font-size: 24px; font-weight: 650; line-height: 1.15; overflow-wrap: anywhere; }
.cifra .v .u { font-size: 13px; font-weight: 500; color: var(--ink-2); margin-right: 3px; }
.cifra .s { font-size: 13px; color: var(--ink-2); }
.cifra.crit .v, .cifra.crit .k { color: var(--crit-ink); }
.aviso { display: flex; gap: 8px; align-items: flex-start; padding: 10px 12px; border-radius: 10px; font-size: 13px; background: var(--warn-bg); color: var(--ink); }
.aviso svg { color: var(--warn-ink); flex: none; margin-top: 1px; }

/* Tablas */
.tbl-wrap { overflow-x: auto; max-width: 100%; }
table.t { width: 100%; border-collapse: collapse; font-size: 13px; }
.t th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--ink-2); font-weight: 600; padding: 6px 8px; border-bottom: 1px solid var(--axis); vertical-align: bottom; }
.t td { padding: 8px; border-bottom: 1px solid var(--hair); vertical-align: top; overflow-wrap: anywhere; }
.t th:first-child, .t td:first-child { padding-left: 0; }
.t th:last-child, .t td:last-child { padding-right: 0; }
.t .n { text-align: right; white-space: nowrap; }
.t th.n { white-space: normal; }
.t tr.click { cursor: pointer; }
.t tr.click:hover td { background: var(--surface-2); }
.t tr.det td { background: var(--surface-2); padding: 8px 10px; }
.t tr.tot td { font-weight: 650; border-bottom: 0; border-top: 1px solid var(--axis); }

  if (!m || !SECS.some(s => s.id === m[1])) return false;

  mostrar(sec);
  if (empujar) { try { history.replaceState(null, "", hash); } catch (e) { /* sin historial */ } }
  const dest = m[2] ? document.getElementById(sec + "-" + m[2]) : null;

function marcarSucias() { for (const s of SECS) SUCIA[s.id] = true; }

  pintarCabecera();

  window.scrollTo(0, Math.min(y, document.documentElement.scrollHeight));
}
function cambiarFoco(w) {

  ST.foco = w; refrescar();
}
function pintarCabecera() {
  const f = ST.foco;
  const estC = completa(f) ? "cerrada" : `en curso · ${X.S[f].dias_ops || 0} d`;
  $("#chip-sem").replaceChildren(h("span", {}, semLabel(f)), h("span", { class: "est est-l" }, "· " + estadoSem(f)), h("span", { class: "est est-c" }, "· " + estC), icono("abajo", 16));
  $("#chip-sem").setAttribute("aria-label", `Semana elegida: ${semLabel(f)}, ${estadoSem(f)}. Cambiar semana o período`);

    b.replaceChildren(h("div", { class: "banner", role: "status" }, h("p", {},
      h("span", { class: "largo" }, "Hay datos de la semana en curso (", h("b", {}, `${semLabel(ec)}, ${plural(X.S[ec].dias_ops || 0, "día", "días")}`), "). Los indicadores muestran la ", ec === f + 1 ? "última cerrada." : "semana elegida."),
      h("span", { class: "corto" }, "En curso: ", h("b", {}, `${semLabel(ec)}, ${plural(X.S[ec].dias_ops || 0, "día", "días")}`), " ·"),
      " ", h("button", { type: "button", class: "link", id: "b-ver-curso", onclick: () => cambiarFoco(ec), "aria-label": "Ver la semana en curso" }, "Ver"))));
  } else b.replaceChildren();
  const dark = temaOscuro();

/* ---------- selector ---------- */
let volverFoco = null;
function abrirHoja(titulo, cuerpo, o = {}) {
  const hoja = $("#hoja"), velo = $("#velo");
  if (hoja.hidden) volverFoco = document.activeElement;
  hoja.className = "hoja gut" + (o.ancha ? " ancha" : "");
  hoja.replaceChildren(h("div", { class: "agarre", "aria-hidden": "true" }),
    h("div", { class: "hoja-h" }, h("h2", { id: "hoja-t" }, titulo), h("button", { type: "button", class: "b-ic", id: "hoja-x", "aria-label": "Cerrar", onclick: cerrarSelector }, icono("cerrar", 20))),
    ...limpio(cuerpo));
  velo.hidden = false; hoja.hidden = false; hoja.scrollTop = 0; document.body.classList.add("hoja-abierta");
  dibujarCola();
  ((o.foco && $(o.foco)) || $("#hoja-x")).focus();
}
function abrirSelector() {
  const hoja = $("#hoja"), velo = $("#velo");
  if (hoja.hidden) volverFoco = document.activeElement;
  hoja.className = "hoja gut";
  const lista = h("ul", { class: "semanas" });
  for (let w = X.nW - 1; w >= 0; w--) {
    lista.append(h("li", {}, h("button", { type: "button", id: "w-" + w, "aria-pressed": w === ST.foco ? "true" : "false", onclick: () => { cerrarSelector(); cambiarFoco(w); } },
      h("span", { class: "nm" }, semLabel(w)), h("span", { class: "es" }, estadoSem(w)), icono("check", 18, "ck"))));
  }
  hoja.replaceChildren(h("div", { class: "agarre", "aria-hidden": "true" }),
    h("div", { class: "hoja-h" }, h("h2", { id: "hoja-t" }, "Semana y período"), h("button", { type: "button", class: "b-ic", id: "hoja-x", "aria-label": "Cerrar", onclick: cerrarSelector }, icono("cerrar", 20))),
    h("div", {}, h("p", { class: "grupo-t" }, "Período"), seg("rango", RANGOS, ST.rango, v => { ST.rango = String(v); LS.set("rg2.rango", ST.rango); for (const b of hoja.querySelectorAll("#hoja .seg button")) b.setAttribute("aria-pressed", b.id === "rango-" + v ? "true" : "false"); refrescar(); }, "Período"),
      h("p", { class: "nota", style: "margin-top:6px" }, "Clientes, Operación y Control usan el período; siempre termina en la semana elegida.")),
    h("div", {}, h("p", { class: "grupo-t" }, "Semana"), lista));
  velo.hidden = false; hoja.hidden = false; document.body.classList.add("hoja-abierta");
  const sel = $("#w-" + ST.foco);
  (sel || $("#hoja-x")).focus();
  if (sel && sel.scrollIntoView) sel.scrollIntoView({ block: "center" });
}
function cerrarSelector() {
  $("#hoja").hidden = true; $("#velo").hidden = true; document.body.classList.remove("hoja-abierta");
  if (volverFoco && volverFoco.isConnected) volverFoco.focus(); else $("#chip-sem").focus();
}

/* ---------- tema ---------- */
const temaOscuro = () => { const t = document.documentElement.getAttribute("data-theme"); return t ? t === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches; };
(function () { const t = LS.get("rg2.tema"); if (t === "dark" || t === "light") document.documentElement.setAttribute("data-theme", t); })();

/* ---------- arranque ---------- */
function armarApp() {
  const nav = $("#nav");
  nav.replaceChildren(...SECS.map(s => h("button", { type: "button", "data-sec": s.id, "aria-current": "false", onclick: () => ir("#" + s.id) }, icono(s.ic, 22), h("span", {}, s.t))));
  $("#secs").replaceChildren(...SECS.map(s => h("section", { id: "s-" + s.id, class: "sec", "aria-label": s.t, hidden: true })));
  $("#chip-sem").addEventListener("click", abrirSelector);
  $("#velo").addEventListener("click", cerrarSelector);
  $("#b-tema").addEventListener("click", () => {
    const nuevo = temaOscuro() ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", nuevo); LS.set("rg2.tema", nuevo); pintarCabecera();
  });
  document.addEventListener("keydown", e => {
    const hoja = $("#hoja"); if (hoja.hidden) return;
    if (e.key === "Escape") { e.preventDefault(); cerrarSelector(); return; }
    if (e.key === "Tab") {
      const f = [...hoja.querySelectorAll("button, [href], input, [tabindex]:not([tabindex='-1'])")].filter(x => !x.disabled && x.offsetParent !== null);
      if (!f.length) return;
      const i = f.indexOf(document.activeElement);
      if (e.shiftKey && (i <= 0)) { e.preventDefault(); f[f.length - 1].focus(); }
      else if (!e.shiftKey && i === f.length - 1) { e.preventDefault(); f[0].focus(); }
    }
  });
  document.addEventListener("click", e => {
    const a = e.target.closest && e.target.closest("a[href^='#']");
    if (!a) return;
    const href = a.getAttribute("href");
    if (ir(href)) e.preventDefault();
  });
  window.addEventListener("hashchange", () => ir(location.hash, false));
  // si el host cambia data-theme con la página abierta, el rótulo del botón de tema se actualiza
  try { new MutationObserver(() => { $("#b-tema").setAttribute("aria-label", temaOscuro() ? "Cambiar a tema claro" : "Cambiar a tema oscuro"); })
    .observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] }); } catch (e) { /* sin MutationObserver */ }
  let mq = window.matchMedia("(min-width: 960px)"), ult = mq.matches;
  let t = null;
  window.addEventListener("resize", () => {

}
function iniciar() {

  try { preparar(); } catch (e) { console.error(e); mensaje("No se pudieron leer los datos", "El archivo de datos está incompleto. Generalo de nuevo con correr.py --tablero-v2."); return; }
  if (!X.nW) { mensaje("Sin semanas", "Los datos no traen ninguna semana."); return; }
  ST.foco = D.foco != null && D.foco >= 0 && D.foco < X.nW ? D.foco : X.nW - 1;
  const r = LS.get("rg2.rango"); if (RANGOS.some(x => x[0] === r)) ST.rango = r;
  $("#pant-clave").hidden = true; $("#pant-msj").hidden = true; $("#app").hidden = false;
  if (D.titulo) $("#titulo").textContent = D.titulo;
  armarApp();
  marcarSucias();
  pintarCabecera();
  const guardada = LS.get("rg2.seccion");
  if (!ir(location.hash, false)) ir("#" + (SECS.some(s => s.id === guardada) ? guardada : "semana"), false);
}
function mensaje(t, p) {
  $("#app").hidden = true; $("#pant-clave").hidden = true; $("#pant-msj").hidden = false;
  $("#msj-t").textContent = t; $("#msj-p").textContent = p;
}
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

  const key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(PAQUETE.s), iterations: PAQUETE.it, hash: "SHA-256" },
    base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  const plano = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(PAQUETE.iv) }, key, b64(PAQUETE.ct));

if (PAQUETE && PAQUETE.plano) {
  D = PAQUETE.plano; iniciar();
} else if (PAQUETE && PAQUETE.ct) {
  $("#pant-clave").hidden = false;
  $("#form-clave").addEventListener("submit", async ev => {
    ev.preventDefault();
    const err = $("#err-clave"), go = $("#abrir");
    if (!window.crypto || !crypto.subtle) { err.textContent = "Este navegador no puede descifrar los datos. Abrilo con Chrome, Edge, Safari o Firefox."; return; }
    go.disabled = true; go.textContent = "Abriendo…"; err.textContent = "";
    try { D = await descifrar($("#clave").value); $("#clave").value = ""; iniciar(); }
    catch (e) { err.textContent = "La clave no es correcta. Revisala y probá de nuevo."; $("#clave").focus(); }
    finally { go.disabled = false; go.textContent = "Abrir"; }
  });
} else {
  mensaje("Tablero semanal", "Sin datos: generalo con correr.py --tablero-v2.");
}
