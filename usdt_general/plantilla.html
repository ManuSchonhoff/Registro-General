<style>

:root {

}

    --ink: #f0efec; --ink-2: #c3c2b7; --ink-3: #a3a29b;
    --hair: #2c2c2a; --axis: #45453f; --focus: #5b9be6;
    --venta: #3987e5; --compra: #d95926; --principal: #9085e9; --coco: #199e70; --neutro: #6b7890;
    --ok-ink: #0ca30c; --ok-bg: rgba(12,163,12,.16); --warn-ink: #fab219; --warn-bg: rgba(250,178,25,.14);

}
:root[data-theme="dark"] {

.aviso { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: 10px; background: var(--warn-bg); color: var(--ink); border: 1px solid transparent; font-size: 14px; }

.lado-v { color: var(--venta); font-weight: 700; } .lado-c { color: var(--compra); font-weight: 700; }
.pager { display: flex; gap: 8px; align-items: center; justify-content: center; flex-wrap: wrap; }
.pager button, .btn { border: 1px solid var(--axis); background: var(--surface); border-radius: 8px; min-height: 38px; padding: 0 14px; }

/* Control */
.chk { background: var(--surface); border: 1px solid var(--hair); border-radius: 12px; }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

  if (a >= 1e6) return NF[1].format(x / 1e6) + " M"; if (a >= 1e4) return NF[0].format(x / 1e3) + " k";

/* Métricas de un mes para el libro elegido (suma de libros si es "Todo") */
function met(m, libs = libros()) {
  const ls = libs.filter(l => m.libros[l]).map(l => m.libros[l]);
  if (!ls.length) return null;
  if (ls.length === 1) return Object.assign({ libros: libs.filter(l => m.libros[l]) }, ls[0]);
  const s = k => ls.reduce((a, x) => a + (x[k] || 0), 0);
  const vc = s("vend_c"), cc = s("cob_c"), oc = s("comp_c"), pc = s("pag_c");
  const pv = vc ? cc / vc : null, pp = oc ? pc / oc : null;
  const cerrado = ls.every(x => x.estado === "cerrado");
  const g = cerrado ? s("ganancia") : null;
  return { libros: libs.filter(l => m.libros[l]), vendidos: s("vendidos"), comprados: s("comprados"), cobrados: s("cobrados"), pagados: s("pagados"),
    precio_venta: pv, precio_compra: pp, dif_precio: pv && pp ? pv - pp : null, dif_pct: pv && pp ? pv / pp - 1 : null,
    sin_recomprar: s("sin_recomprar"), faltan_usdt: s("faltan_usdt"), ganancia: g, margen: g != null && s("vendidos") ? g / s("vendidos") : null,
    estado: cerrado ? "cerrado" : "abierto", incompletas: s("incompletas"), comision: s("comision"), filas_v: s("filas_v"), filas_c: s("filas_c"),
    dias: Math.max(...ls.map(x => x.dias)), ultima_fecha: ls.map(x => x.ultima_fecha).sort().pop(), ganancia_hoja: s("ganancia_hoja") };
}
const ultimoCerrado = () => { for (let i = MESES.length - 1; i >= 0; i--) { const x = met(MESES[i]); if (x && x.estado === "cerrado") return i; } return -1; };
const anteriorCerrado = i => { for (let j = i - 1; j >= 0; j--) { const x = met(MESES[j]); if (x && x.estado === "cerrado") return j; } return -1; };

/* ---------- tooltip y ayudas ---------- */
const tip = $("#tip"), pop = $("#pop");
function showTip(html, ev) {
  tip.innerHTML = html; tip.hidden = false;
  const r = tip.getBoundingClientRect(), W = innerWidth, H = innerHeight;
  let x = ev.clientX + 12, y = ev.clientY - r.height - 10;
  if (x + r.width > W - 8) x = Math.max(8, ev.clientX - r.width - 12);
  if (y < 8) y = ev.clientY + 16; if (y + r.height > H - 8) y = H - r.height - 8;
  tip.style.left = x + "px"; tip.style.top = y + "px";
}
const hideTip = () => { tip.hidden = true; };
document.addEventListener("scroll", hideTip, { passive: true });
document.addEventListener("click", e => {
  const b = e.target.closest("[data-ayuda]");
  if (b) {
    e.stopPropagation();
    pop.textContent = AYUDA[b.dataset.ayuda] || ""; pop.hidden = false;
    const r = b.getBoundingClientRect(), p = pop.getBoundingClientRect();
    pop.style.left = Math.max(8, Math.min(innerWidth - p.width - 8, r.left - 10)) + "px";
    pop.style.top = (r.top - p.height - 8 > 8 ? r.top - p.height - 8 : r.bottom + 8) + "px";
    return;
  }
  pop.hidden = true;
  if (!e.target.closest(".chart")) hideTip();
});

/* ---------- gráficos SVG ---------- */
let W_SVG = 640;
const anchoDe = el => Math.max(300, Math.round(el.clientWidth || 640));
function escalaY(max, min = 0) {
  const span = (max - min) || 1, paso0 = span / 4, mag = Math.pow(10, Math.floor(Math.log10(paso0)));
  const paso = [1, 2, 2.5, 5, 10].map(f => f * mag).find(p => p >= paso0);
  const lo = Math.floor(min / paso) * paso, hi = Math.ceil(max / paso) * paso, ticks = [];
  for (let v = lo; v <= hi + paso / 2; v += paso) ticks.push(v);
  return { lo, hi, ticks };
}
/* Barras verticales. series: [{nombre, color, valores, huecos?}] apiladas si stacked */
function barras(el, { cats, series, alto = 220, fmt = corto, tipFmt, onClick, stacked = true, refLinea = null, rotular = null, sel = null }) {
  W_SVG = anchoDe(el);
  const n = cats.length, mL = 44, mR = 8, mT = 10, mB = 24, w = W_SVG - mL - mR, h = alto - mT - mB;
  let max = 0, min = 0;
  for (let i = 0; i < n; i++) {
    let pos = 0, neg = 0;
    series.forEach(s => { const v = s.valores[i] || 0; if (stacked) { if (v > 0) pos += v; else neg += v; } else { pos = Math.max(pos, v); neg = Math.min(neg, v); } });
    series.forEach(s => { if (s.huecos && s.huecos[i] != null) pos = Math.max(pos, s.huecos[i]); });
    max = Math.max(max, pos); min = Math.min(min, neg);
  }
  if (refLinea != null) max = Math.max(max, refLinea);
  const E = escalaY(max, min), y = v => mT + h - (v - E.lo) / (E.hi - E.lo) * h;
  const bw = w / n, gap = Math.min(6, bw * 0.25), bwi = Math.max(1, bw - gap);
  let svg = `<svg viewBox="0 0 ${W_SVG} ${alto}" role="img">`;
  E.ticks.forEach(t => { svg += `<line class="grid-l" x1="${mL}" x2="${W_SVG - mR}" y1="${y(t)}" y2="${y(t)}"/><text x="${mL - 6}" y="${y(t) + 4}" text-anchor="end">${fmt(t)}</text>`; });
  svg += `<line class="base" x1="${mL}" x2="${W_SVG - mR}" y1="${y(0)}" y2="${y(0)}"/>`;
  const salto = Math.ceil(n / Math.max(1, Math.floor(w / 46)));
  for (let i = 0; i < n; i++) {
    const x = mL + i * bw + gap / 2;
    let pos = 0, neg = 0;
    series.forEach(s => {
      const v = s.valores[i];
      if (v != null && v !== 0) {
        let y0, y1;
        if (!stacked) { y0 = 0; y1 = v; } else if (v > 0) { y0 = pos; y1 = pos + v; pos = y1; } else { y0 = neg; y1 = neg + v; neg = y1; }
        const yt = y(Math.max(y0, y1)), yb = y(Math.min(y0, y1)), hh = Math.max(1, yb - yt - (stacked && series.length > 1 ? 1 : 0));
        svg += `<rect x="${x}" y="${yt}" width="${bwi}" height="${hh}" rx="${Math.min(3, bwi / 3)}" fill="${s.color}"${sel === i || sel == null ? "" : ' opacity=".45"'}/>`;
      }
      if (s.huecos && s.huecos[i] != null) {
        const hv = s.huecos[i]; const yt = y(Math.max(0, hv)), yb = y(Math.min(0, hv));
        svg += `<rect x="${x + 1}" y="${yt}" width="${Math.max(1, bwi - 2)}" height="${Math.max(2, yb - yt)}" rx="3" fill="none" stroke="${s.color}" stroke-width="1.5" stroke-dasharray="4 3"/>`;
      }
    });
    if (rotular && rotular[i]) svg += `<text x="${x + bwi / 2}" y="${mT + 10}" text-anchor="middle" font-weight="700">${rotular[i]}</text>`;
    if (i % salto === 0) svg += `<text x="${x + bwi / 2}" y="${alto - 6}" text-anchor="middle">${esc(cats[i].c)}</text>`;
    svg += `<rect class="hit" data-i="${i}" x="${mL + i * bw}" y="${mT}" width="${bw}" height="${h}"/>`;
  }
  if (refLinea != null) svg += `<line x1="${mL}" x2="${W_SVG - mR}" y1="${y(refLinea)}" y2="${y(refLinea)}" stroke="${cssv("--ink-3")}" stroke-dasharray="3 4"/>`;
  svg += "</svg>";
  el.innerHTML = svg;
  el.querySelectorAll(".hit").forEach(r => {
    const i = +r.dataset.i;
    const html = () => tipFmt ? tipFmt(i) : `<b>${esc(cats[i].l)}</b>` + series.map(s => `${esc(s.nombre)}: ${fmt(s.valores[i])}`).join("<br>");
    r.addEventListener("pointermove", ev => showTip(html(), ev));
    r.addEventListener("pointerleave", ev => { if (ev.pointerType === "mouse") hideTip(); });
    r.addEventListener("click", ev => { if (ev.pointerType !== "mouse" && tip.hidden) { showTip(html(), ev); return; } if (onClick) { hideTip(); onClick(i); } else showTip(html(), ev); });
  });
}
/* Líneas: series [{nombre, color, valores}] */
function lineas(el, { cats, series, alto = 200, fmt = corto, tipFmt, cero = false }) {
  W_SVG = anchoDe(el);
  const n = cats.length, mL = 52, mR = 10, mT = 10, mB = 24, w = W_SVG - mL - mR, h = alto - mT - mB;
  const vals = series.flatMap(s => s.valores).filter(v => v != null);
  if (!vals.length) { el.innerHTML = '<p class="muted small">Sin datos para graficar.</p>'; return; }
  let max = Math.max(...vals), min = cero ? 0 : Math.min(...vals);
  const pad = (max - min) * 0.08 || 1; if (!cero) min -= pad; max += pad;
  const E = escalaY(max, min), y = v => mT + h - (v - E.lo) / (E.hi - E.lo) * h, x = i => mL + (n === 1 ? w / 2 : i * w / (n - 1));
  let svg = `<svg viewBox="0 0 ${W_SVG} ${alto}" role="img">`;
  E.ticks.forEach(t => { svg += `<line class="grid-l" x1="${mL}" x2="${W_SVG - mR}" y1="${y(t)}" y2="${y(t)}"/><text x="${mL - 6}" y="${y(t) + 4}" text-anchor="end">${fmt(t)}</text>`; });
  const salto = Math.ceil(n / Math.max(1, Math.floor(w / 46)));
  for (let i = 0; i < n; i += salto) svg += `<text x="${x(i)}" y="${alto - 6}" text-anchor="middle">${esc(cats[i].c)}</text>`;
  series.forEach(s => {
    let d = "", pen = false;
    s.valores.forEach((v, i) => { if (v == null) { pen = false; return; } d += (pen ? "L" : "M") + x(i).toFixed(1) + " " + y(v).toFixed(1); pen = true; });
    svg += `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    const last = s.valores.map((v, i) => [v, i]).filter(a => a[0] != null).pop();
    if (last) svg += `<circle cx="${x(last[1])}" cy="${y(last[0])}" r="4" fill="${s.color}" stroke="${cssv("--surface")}" stroke-width="2"/>`;
  });
  const bw = w / Math.max(1, n - 1);
  for (let i = 0; i < n; i++) svg += `<rect class="hit" data-i="${i}" x="${x(i) - bw / 2}" y="${mT}" width="${bw}" height="${h}"/>`;
  svg += "</svg>";
  el.innerHTML = svg;
  el.querySelectorAll(".hit").forEach(r => {
    const i = +r.dataset.i;
    const html = () => tipFmt ? tipFmt(i) : `<b>${esc(cats[i].l)}</b>` + series.map(s => `${esc(s.nombre)}: ${fmt(s.valores[i])}`).join("<br>");
    r.addEventListener("pointermove", ev => showTip(html(), ev));
    r.addEventListener("pointerleave", ev => { if (ev.pointerType === "mouse") hideTip(); });
    r.addEventListener("click", ev => showTip(html(), ev));
  });
}
function hbars(el, items, { color, onClick, max } = {}) {
  const mx = max || Math.max(...items.map(x => x.valor), 1);
  el.innerHTML = `<div class="hbar">${items.map((x, i) => `<button type="button" class="hb" data-i="${i}" ${onClick ? "" : "disabled"}>
    <span class="t"><span>${esc(x.nombre)}</span><span>${x.txt}</span></span>
    <span class="barra"><i style="width:${Math.max(1, x.valor / mx * 100)}%;background:${x.color || color}"></i></span>
    ${x.sub ? `<span class="s">${x.sub}</span>` : ""}</button>`).join("")}</div>`;
  if (onClick) el.querySelectorAll(".hb").forEach(b => b.addEventListener("click", () => onClick(items[+b.dataset.i])));
}
const ley = items => `<div class="ley">${items.map(([n, c, hueco]) => `<span><i class="dot" style="${hueco ? `border:1.5px dashed ${c};background:transparent` : `background:${c}`}"></i>${esc(n)}</span>`).join("")}</div>`;

function ir(p, opts = {}) {
  if (![...PAGS.map(x => x[0]), "ayuda"].includes(p)) p = "inicio";

      <p class="xs">Generado el ${esc(D.meta.generado)}.</p></div>`;
