:root {

  --s1: #2a78d6; --s2: #eb6834; --s3: #199e70;
  --warn: #8a5a00; --warn-bg: rgba(250,178,25,.14); --ok: #006300; --ok-bg: rgba(12,163,12,.10);
  --info-bg: rgba(42,120,214,.08); --velo: rgba(18,18,17,.38); --sombra: rgba(18,18,17,.12);

    --ink: #f0efec; --ink-2: #c3c2b7; --ink-3: #a3a29b;
    --hair: #2c2c2a; --axis: #45453f; --focus: #5b9be6;
    --dato: #6b7890; --dato-foco: #c9d6ea; --dato-suave: rgba(107,120,144,.45); --area: rgba(201,214,234,.10);
    --s1: #3987e5; --s2: #d95926; --s3: #199e70;
    --warn: #fab219; --warn-bg: rgba(250,178,25,.14); --ok: #0ca30c; --ok-bg: rgba(12,163,12,.14);
    --info-bg: rgba(91,155,230,.12); --velo: rgba(0,0,0,.6); --sombra: rgba(0,0,0,.45);
  }
}

function grafEvolucion(el, Wd) {
  const ss = RANGO();
  const H = Wd < 600 ? 190 : 220, mL = 44, mR = 12, mT = 14, mB = 34;
  const series = [
    { k: "disponible", n: "Disponible", c: "var(--s1)", v: s => s.disponible },
    { k: "proyectos", n: "Proyectos", c: "var(--s2)", v: s => s.grupos.proyectos },
    { k: "fijos", n: "Cargado a mano", c: "var(--s3)", v: s => s.fijos },
  ];
  const apilable = ss.every(s => series.every(se => se.v(s) >= -0.5));
  const et = ejeTiempo(ss, mL, Wd - mR);
  const px = s => et.x(fecha(s.fin).getTime() + 864e5 / 2);
  const max = apilable ? Math.max(...ss.map(s => s.neto)) : Math.max(...ss.flatMap(s => series.map(se => se.v(s))));
  const min = apilable ? 0 : Math.min(0, ...ss.flatMap(s => series.map(se => se.v(s))));
  const sc = escala(min, max * 1.06, 4);
  const y = v => mT + (H - mT - mB) * (1 - (v - sc.lo) / (sc.hi - sc.lo));
  const svg = sv("svg", { viewBox: `0 0 ${Wd} ${H}`, role: "img", "aria-label": "Disponible, proyectos y cargado a mano por semana" });
  for (const t of sc.t) {

    svg.append(sv("text", { x: mL - 6, y: y(t) + 4, "text-anchor": "end", class: "eje" }, fK(t)));
  }
  if (apilable) {
    let base = ss.map(() => 0);
    for (const se of series) {
      const top = ss.map((s, i) => base[i] + Math.max(0, se.v(s)));
      const d = "M" + ss.map((s, i) => `${px(s)},${y(top[i])}`).join("L") + "L" + ss.map((s, i) => `${px(s)},${y(base[i])}`).reverse().join("L") + "Z";
      svg.append(sv("path", { d, fill: se.c, "fill-opacity": 0.85, stroke: "var(--surface)", "stroke-width": 1 }));

    for (const se of series) svg.append(sv("path", { d: "M" + ss.map(s => `${px(s)},${y(se.v(s))}`).join("L"), fill: "none", stroke: se.c, "stroke-width": 2 }));
  }

  const pintar = i => {
    const s = i === null ? W[ST.foco] : ss[i];

  };

  pintar(null);

  const svg = sv("svg", { viewBox: `0 0 ${Wd} ${H}`, role: "img", "aria-label": "Antes de gastos y gastos por mes" });
  for (const t of sc.t) {
