  --s1: #2a78d6; --s2: #eb6834; --s3: #199e70;
  --warn: #8a5a00; --warn-bg: rgba(250,178,25,.14); --ok: #006300; --ok-bg: rgba(12,163,12,.10);
  --info-bg: rgba(42,120,214,.08); --velo: rgba(18,18,17,.38); --sombra: rgba(18,18,17,.12);

    --ink: #f0efec; --ink-2: #c3c2b7; --ink-3: #a3a29b;
    --hair: #2c2c2a; --axis: #45453f; --focus: #5b9be6;
    --dato: #6b7890; --dato-foco: #c9d6ea; --dato-suave: rgba(107,120,144,.45); --area: rgba(201,214,234,.10);
    --s1: #3987e5; --s2: #d95926; --s3: #199e70;
    --warn: #fab219; --warn-bg: rgba(250,178,25,.14); --ok: #0ca30c; --ok-bg: rgba(12,163,12,.14);
    --info-bg: rgba(91,155,230,.12); --velo: rgba(0,0,0,.6); --sombra: rgba(0,0,0,.45);
  }
}

function aplicarPeriodo() {

  else if (ST.periodo === "3m") {

// ------------------------------------------------------------------------------------------------ escalas y ejes
function escala(lo, hi, n = 4) {
  if (lo === hi) { lo -= 1; hi += 1; }
  const raw = (hi - lo) / n, p = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1, 2, 2.5, 5, 10].map(m => m * p).find(s => s >= raw) || 10 * p;
  const a = Math.floor(lo / step) * step, b = Math.ceil(hi / step) * step;
  const t = []; for (let v = a; v <= b + step / 2; v += step) t.push(Math.abs(v) < step / 1e6 ? 0 : v);
  return { lo: a, hi: b, t };
}
const anchoDe = el => Math.max(280, Math.round((el.clientWidth || el.parentNode.clientWidth || 600)));
const DIBUJOS = [];
function lienzo(dibujar) { const el = h("div", { class: "graf" }); DIBUJOS.push({ el, dibujar }); return el; }

let tRes = null; let anchoPrevio = window.innerWidth;

// Ejes de tiempo: x por fecha (inicio de la semana al fin + 1 día)
function ejeTiempo(ss, x0, x1) {
  const t0 = fecha(ss[0].ini).getTime(), t1 = fecha(ss[ss.length - 1].fin).getTime() + 864e5;
  const x = t => x0 + (t - t0) / (t1 - t0) * (x1 - x0);
  return { x, ini: s => x(fecha(s.ini).getTime()), fin: s => x(fecha(s.fin).getTime() + 864e5), mid: s => (x(fecha(s.ini).getTime()) + x(fecha(s.fin).getTime() + 864e5)) / 2 };
}
function marcasMes(svg, ss, et, y, x0, x1) {
  let prev = null;
  const minGap = 34;
  let ultX = -1e9;
  for (const s of ss) {
    const m = s.mes;
    if (m !== prev) {
      const px = et.ini(s);
      if (px - ultX >= minGap && px <= x1 - 10) {
        svg.append(sv("line", { x1: px, x2: px, y1: y - 4, y2: y, stroke: "var(--axis)", "stroke-width": 1 }));
        svg.append(sv("text", { x: px + 3, y: y + 12, class: "eje" }, mesCorto(m)));
        ultX = px;
      }
      prev = m;
    }
  }
}
function filaMarcas(svg, ss, et, y, x0, angosto) {
  const orden = angosto ? ["rev", "aj", "ret", "doble"] : ["rev", "aj", "ret", "doble", "dudoso", "gastos"];
  for (const s of ss) {
    const ks = s.marcas.map(m => m.k);
    const pri = orden.find(k => ks.includes(k));
    if (!pri) continue;
    svg.append(sv("text", { x: et.mid(s), y, "text-anchor": "middle", class: pri === "rev" || pri === "dudoso" ? "mk-w" : "mk" }, ICO[pri]));
  }
}

// Interacción común: la semana más cercana al puntero, lectura fija y clic para cambiar la foco
function interactivo(svg, ss, et, alMover, alElegir) {
  const local = ev => { const r = svg.getBoundingClientRect(); const vb = svg.viewBox.baseVal; return (ev.clientX - r.left) * vb.width / r.width; };
  const cercana = px => { let best = 0, bd = 1e9; ss.forEach((s, i) => { const d = Math.abs(et.mid(s) - px); if (d < bd) { bd = d; best = i; } }); return best; };
  svg.addEventListener("pointermove", ev => alMover(cercana(local(ev))));
  svg.addEventListener("pointerleave", () => alMover(null));
  svg.addEventListener("click", ev => alElegir(cercana(local(ev))));
  svg.setAttribute("tabindex", "0");
  svg.addEventListener("keydown", ev => {
    if (ev.key === "ArrowLeft" || ev.key === "ArrowRight") { ev.preventDefault(); moverFoco(ev.key === "ArrowLeft" ? -1 : 1); }
    else if (ev.key === "Enter") { ev.preventDefault(); abrirSemana(ST.foco); }
  });
}

// ------------------------------------------------------------------------------------------------ gráfico: patrimonio

  const sc = escala(0, Math.max(...vals) * 1.06, 4);

  const et = ejeTiempo(ss, mL, Wd - mR);

  for (const t of sc.t) {

    svg.append(sv("text", { x: mL - 6, y: y(t) + 4, "text-anchor": "end", class: "eje" }, fK(t)));

  // rótulos: inicio, fin

  const guia = sv("line", { y1: mT, y2: H - mB, stroke: "var(--ink-3)", "stroke-width": 1, visibility: "hidden" });

// ------------------------------------------------------------------------------------------------ gráfico: ganancia
function datosGanancia() {
  const ss = RANGO().filter(s => ok(s.gan));
  if (ST.vista === "mes") {
    const por = new Map();
    for (const s of ss) { if (!por.has(s.mes)) por.set(s.mes, []); por.get(s.mes).push(s); }
    return [...por.entries()].map(([id, l]) => {
      const m = MESES[id];
      const sem = suma(l.map(s => s.dias / 7));
      const parcial = !m.completo || l.length < m.hojas.length;
      const base = suma(l.map(s => ST.base === "antes" ? s.antes : s.gan));
      const ajm = suma(l.map(s => s.aj));
      const div = ST.mesModo === "sem" ? sem : 1;
      return { id, txt: mesNombre(id), l, sem, esperadas: m.esperadas, parcial, base: base / div, aj: ST.aj ? ajm / div : 0, ajm, total: (base + (ST.aj ? ajm : 0)) / div };
    });
  }
  return ss.map(s => {
    const base = porSem(ST.base === "antes" ? s.antes : s.gan, s);
    const ajs = porSem(s.aj, s);
    return { id: s.id, s, txt: s.txt, base, aj: ST.aj ? ajs : 0, total: base + (ST.aj ? ajs : 0) };
  });
}
function grafGanancia(el, Wd) {
  const d = datosGanancia();
  if (!d.length) { el.append(h("p", { class: "sub" }, "No hay semanas con ganancia en el período elegido.")); return; }
  const H = Wd < 600 ? 210 : 250, mL = 44, mR = 12, mT = 18, mB = 34;
  const tops = d.map(x => Math.max(x.base, x.base + x.aj, 0)), bots = d.map(x => Math.min(x.base, x.base + x.aj, 0));
  const sc = escala(Math.min(0, ...bots), Math.max(0, ...tops) * 1.08, 4);
  const y = v => mT + (H - mT - mB) * (1 - (v - sc.lo) / (sc.hi - sc.lo));
  const svg = sv("svg", { viewBox: `0 0 ${Wd} ${H}`, role: "img", "aria-label": ST.vista === "mes" ? "Ganancia por mes" : "Ganancia por semana" });
  for (const t of sc.t) {
    svg.append(sv("line", { x1: mL, x2: Wd - mR, y1: y(t), y2: y(t), stroke: t === 0 ? "var(--axis)" : "var(--hair)", "stroke-width": 1 }));
    svg.append(sv("text", { x: mL - 6, y: y(t) + 4, "text-anchor": "end", class: "eje" }, fK(t)));
  }

    const hh = Math.max(yb - ya, 0.8), r = Math.min(4, w / 2, hh);
    const arriba = v1 >= v0;
    // extremo redondeado del lado del dato, base recta
    const p = arriba
      ? `M${x},${yb}V${ya + r}Q${x},${ya} ${x + r},${ya}H${x + w - r}Q${x + w},${ya} ${x + w},${ya + r}V${yb}Z`
      : `M${x},${ya}V${yb - r}Q${x},${yb} ${x + r},${yb}H${x + w - r}Q${x + w},${yb} ${x + w},${yb - r}V${ya}Z`;
    return sv("path", Object.assign({ d: p, fill }, extra));
  };
  const lec = h("div", { class: "lectura", "aria-live": "polite" });

    const slot = (Wd - mL - mR) / d.length, bw = Math.min(40, slot * 0.6);

    d.forEach((m, i) => {

      else svg.append(barra(x, bw, 0, m.base, esFoco ? "var(--dato-foco)" : "var(--dato)"));
      if (m.aj) svg.append(barra(x, bw, m.base, m.base + m.aj, "var(--dato-suave)"));
      const top = Math.max(m.base, m.base + m.aj);
      svg.append(sv("text", { x: cx, y: (m.total >= 0 ? y(top) - 5 : y(Math.min(m.base, m.total)) + 13), "text-anchor": "middle", class: esFoco ? "rot-f" : "rot" }, fK(m.total)));
      svg.append(sv("text", { x: cx, y: H - mB + 16, "text-anchor": "middle", class: "eje" }, mesCorto(m.id)));
      if (m.parcial) svg.append(sv("text", { x: cx, y: H - 4, "text-anchor": "middle", class: "mk" }, `${miles(m.sem, m.sem % 1 ? 1 : 0)}/${m.esperadas} sem.`));
    });
    lecturaDe = i => {
      const m = i === null ? (d.find(x => x.id === W[ST.foco].mes) || d[d.length - 1]) : d[i];
      poner(lec, h("span", { class: "k" }, m.txt + (m.parcial ? ` (${miles(m.sem, m.sem % 1 ? 1 : 0)} de ${m.esperadas} semanas)` : ` (${plural(m.sem, "semana", "semanas")})`)),
        h("b", {}, fU(m.total)), ST.mesModo === "sem" ? h("span", {}, "por semana") : null,
        m.ajm && !ST.aj ? h("span", {}, `sin ${fSU(m.ajm)} de ajustes`) : null,
        h("button", { type: "button", onclick: () => { ST.mesFiltro = m.id; ST.vista = "sem"; guardar("vista", "sem"); render(); } }, "Ver sus semanas"));
    };
    const local = ev => { const r = svg.getBoundingClientRect(); return (ev.clientX - r.left) * Wd / r.width; };
    const idx = px => Math.min(d.length - 1, Math.max(0, Math.floor((px - mL) / slot)));
    svg.addEventListener("pointermove", ev => lecturaDe(idx(local(ev))));
    svg.addEventListener("pointerleave", () => lecturaDe(null));
    svg.addEventListener("click", ev => { const m = d[idx(local(ev))]; const i = W.findIndex(s => s.id === m.l[m.l.length - 1].id); ST.foco = i; render(true); });
  } else {
    let dd = d;
    if (ST.mesFiltro) dd = d.map(x => Object.assign({}, x, { gris: x.s.mes !== ST.mesFiltro }));
    const ss = dd.map(x => x.s);
    const et = ejeTiempo(ss, mL, Wd - mR);
    const med = mediana(dd.map(x => x.total));
    dd.forEach(x => {
      const s = x.s, x0 = et.ini(s), x1 = et.fin(s), slot = x1 - x0;
      const bw = Math.min(s.dias === 14 ? 40 : 22, slot * 0.72), bx = (x0 + x1) / 2 - bw / 2;
      const esFoco = IDX[s.id] === ST.foco;

      g.append(barra(bx, bw, 0, x.base, fill));

      if (tieneMarca(s, "rev")) g.append(sv("rect", { x: bx - 2, y: y(Math.max(0, x.total)) - 2, width: bw + 4, height: Math.abs(y(0) - y(x.total)) + 4, fill: "none", stroke: "var(--warn)", "stroke-width": 1.2, "stroke-dasharray": "3 2", rx: 3 }));
      svg.append(g);

    if (ok(med)) {

      svg.append(sv("text", { x: mL + 4, y: y(med) - 4, class: "rot" }, "semana típica " + fK(med)));
    }
    // rótulo del extremo y del final
    const ext = dd.reduce((a, b) => (Math.abs(b.total) > Math.abs(a.total) ? b : a));
    for (const x of new Set([ext, dd[dd.length - 1]])) {
      const top = Math.max(x.base, x.base + x.aj);
      svg.append(sv("text", { x: et.mid(x.s), y: x.total >= 0 ? y(top) - 5 : y(Math.min(x.base, x.total)) + 13, "text-anchor": "middle", class: "rot" }, fK(x.total)));
    }
    marcasMes(svg, ss, et, H - mB + 4, mL, Wd - mR);
    filaMarcas(svg, ss, et, H - 4, mL, Wd < 600);
    lecturaDe = i => {
      const x = i === null ? (dd.find(z => IDX[z.s.id] === ST.foco) || dd[dd.length - 1]) : dd[i];
      const s = x.s;
      const marcas = s.marcas.filter(m => ["rev", "aj", "ret", "doble"].includes(m.k)).map(m => h("span", { class: "tag" + (m.k === "rev" ? " w" : "") }, ICO[m.k] + " " + NOM_MARCA[m.k]));
      poner(lec, h("span", { class: "k" }, s.txt), h("b", {}, fU(x.total)),
        s.dias === 14 ? h("span", {}, `por semana (total ${fU(x.total * 2)})`) : null,
        h("span", {}, (ST.base === "antes" ? "después de gastos " + fU(porSem(gan(s), s)) : "gastos " + fU(s.gas))), marcas,
        h("button", { type: "button", onclick: () => abrirSemana(IDX[s.id]) }, "Ver semana"));
    };
    interactivo(svg, ss, et, lecturaDe, i => { ST.foco = IDX[ss[i].id]; render(true); });
  }
  lecturaDe(null);
  el.append(lec, svg);
}

function grafEvolucion(el, Wd) {

  const series = [
    { k: "disponible", n: "Disponible", c: "var(--s1)", v: s => s.disponible },

  const apilable = ss.every(s => series.every(se => se.v(s) >= -0.5));

function grafGastos(el, Wd, meses) {
  if (!meses.length) { el.append(h("p", { class: "sub" }, "No hay meses con datos en el período.")); return; }
  const H = Wd < 600 ? 200 : 230, mL = 44, mR = 12, mT = 18, mB = 34;
  const vals = meses.flatMap(m => [m.antes, m.gas]);
  const sc = escala(Math.min(0, ...vals), Math.max(...vals) * 1.1, 4);
  const y = v => mT + (H - mT - mB) * (1 - (v - sc.lo) / (sc.hi - sc.lo));
  const svg = sv("svg", { viewBox: `0 0 ${Wd} ${H}`, role: "img", "aria-label": "Antes de gastos y gastos por mes" });
  for (const t of sc.t) {
    svg.append(sv("line", { x1: mL, x2: Wd - mR, y1: y(t), y2: y(t), stroke: t === 0 ? "var(--axis)" : "var(--hair)", "stroke-width": 1 }));
    svg.append(sv("text", { x: mL - 6, y: y(t) + 4, "text-anchor": "end", class: "eje" }, fK(t)));
  }
  const slot = (Wd - mL - mR) / meses.length, bw = Math.min(20, slot * 0.32);
  meses.forEach((m, i) => {
    const cx = mL + slot * (i + 0.5);
    const par = [[m.antes, "var(--s1)"], [m.gas, "var(--s2)"]];
    par.forEach(([v, c], j) => {
      const x = cx + (j ? 1 : -bw - 1);
      const ya = y(Math.max(0, v)), yb = y(Math.min(0, v));
      svg.append(sv("rect", { x, y: ya, width: bw, height: Math.max(yb - ya, 0.8), rx: 3, fill: m.parcial ? "none" : c, stroke: m.parcial ? c : "none", "stroke-width": m.parcial ? 2 : 0 }));
    });
    svg.append(sv("text", { x: cx, y: H - mB + 16, "text-anchor": "middle", class: "eje" }, mesCorto(m.id)));
    if (m.parcial) svg.append(sv("text", { x: cx, y: H - 4, "text-anchor": "middle", class: "mk" }, "parcial"));
  });
  const lec = h("div", { class: "lectura", "aria-live": "polite" });
  const pintar = i => {
    const m = meses[i === null ? meses.length - 1 : i];
    poner(lec, h("span", { class: "k" }, mesNombre(m.id) + (m.parcial ? " (parcial)" : "")),
      h("span", {}, "antes de gastos ", h("b", { style: "font-size:13px" }, fU(m.antes))), h("span", {}, "gastos ", h("b", { style: "font-size:13px" }, fU(m.gas))),
      h("span", {}, "ganancia ", h("b", { style: "font-size:13px" }, fU(m.antes - m.gas))));
  };
  const local = ev => { const r = svg.getBoundingClientRect(); return (ev.clientX - r.left) * Wd / r.width; };
  const idx = px => Math.min(meses.length - 1, Math.max(0, Math.floor((px - mL) / slot)));
  svg.addEventListener("pointermove", ev => pintar(idx(local(ev))));
  svg.addEventListener("pointerleave", () => pintar(null));
  pintar(null);
  el.append(lec, svg, h("div", { class: "ley" }, h("span", {}, h("span", { class: "sw", style: "background:var(--s1)" }), "Lo que dejó la operación (antes de gastos)"),
    h("span", {}, h("span", { class: "sw", style: "background:var(--s2)" }), "Gastos, comisiones, intereses e inversión")));

function mesesRango() {

    h("dl", { class: "cuenta" },

  abrirCapa(s.txt, `${dmy(s.ini)} al ${dmy(s.fin)} · hoja ${s.hoja}`, c, nav);

function filtros() {

      h("button", { type: "button", "aria-pressed": String(ST.periodo === "elegido"), onclick: abrirPeriodo }, ST.periodo === "elegido" ? `${W[ST.desde].txt} → ${W[ST.hasta].txt}` : "Elegir…")),
    seg("s-aj", [[false, "Sin ajustes"], [true, "Con ajustes"]], ST.aj, v => { ST.aj = v; guardar("aj", v); render(); }, "Ajustes a mano"));

    resumen(), seccionGanancia(), seccionPlata(), seccionGastos(), seccionSocios(), seccionSemanas(), seccionCreo());
  requestAnimationFrame(() => { dibujarTodo(); if (conservarScroll) window.scrollTo(0, y); });
}
document.getElementById("b-foco").addEventListener("click", abrirListaSemanas);
