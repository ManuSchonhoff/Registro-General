<title>Value Cambio General</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="robots" content="noindex, nofollow">
<style>
/* Una página que se recorre de arriba abajo: resumen, porqué, consulta. Encabezado fijo con la semana foco y los filtros.
   Misma familia que el Tablero semanal del Registro: tinta para la interfaz, color solo para datos y estados. */
:root {
  color-scheme: light;
  --bg: #f6f6f3; --surface: #fdfdfc; --surface-2: #efeee9;
  --ink: #121211; --ink-2: #4f4e4a; --ink-3: #6b6a65;
  --hair: #e3e2db; --axis: #c3c2b7; --focus: #2a78d6;
  --dato: #848fa3; --dato-foco: #2f4466; --dato-suave: rgba(132,143,163,.38); --area: rgba(47,68,102,.10);
  --s1: #2a78d6; --s2: #eb6834; --s3: #199e70;
  --warn: #8a5a00; --warn-bg: rgba(250,178,25,.14); --ok: #006300; --ok-bg: rgba(12,163,12,.10);
  --info-bg: rgba(42,120,214,.08); --velo: rgba(18,18,17,.38); --sombra: rgba(18,18,17,.12);
  --font: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --head-h: 52px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0f0f0e; --surface: #1a1a19; --surface-2: #232321;
    --ink: #f0efec; --ink-2: #c3c2b7; --ink-3: #a3a29b;
    --hair: #2c2c2a; --axis: #45453f; --focus: #5b9be6;
    --dato: #6b7890; --dato-foco: #c9d6ea; --dato-suave: rgba(107,120,144,.45); --area: rgba(201,214,234,.10);
    --s1: #3987e5; --s2: #d95926; --s3: #199e70;
    --warn: #fab219; --warn-bg: rgba(250,178,25,.14); --ok: #0ca30c; --ok-bg: rgba(12,163,12,.14);
    --info-bg: rgba(91,155,230,.12); --velo: rgba(0,0,0,.6); --sombra: rgba(0,0,0,.45);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0f0f0e; --surface: #1a1a19; --surface-2: #232321;
  --ink: #f0efec; --ink-2: #c3c2b7; --ink-3: #a3a29b;
  --hair: #2c2c2a; --axis: #45453f; --focus: #5b9be6;
  --dato: #6b7890; --dato-foco: #c9d6ea; --dato-suave: rgba(107,120,144,.45); --area: rgba(201,214,234,.10);
  --s1: #3987e5; --s2: #d95926; --s3: #199e70;
  --warn: #fab219; --warn-bg: rgba(250,178,25,.14); --ok: #0ca30c; --ok-bg: rgba(12,163,12,.14);
  --info-bg: rgba(91,155,230,.12); --velo: rgba(0,0,0,.6); --sombra: rgba(0,0,0,.45);
}
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; scroll-padding-top: calc(env(safe-area-inset-top, 0px) + var(--head-h) + 12px); }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 var(--font); }
body.panel-abierto { overflow: hidden; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.vh { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.gut { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.in { max-width: 1160px; margin: 0 auto; min-width: 0; }
.num { font-variant-numeric: tabular-nums; }
.neg { white-space: nowrap; }

/* Encabezado */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--hair); }
.top-1 { min-height: var(--head-h); display: flex; align-items: center; gap: 8px; }
.top h1 { font-size: 16px; margin: 0; font-weight: 650; letter-spacing: -.01em; white-space: nowrap; }
.top h1 span { color: var(--ink-3); font-weight: 500; }
.sp { flex: 1; }
.chip-foco { display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 0 12px; border: 1px solid var(--axis); border-radius: 20px;
  background: var(--surface); font-weight: 600; white-space: nowrap; min-width: 0; }
.chip-foco small { font-weight: 400; color: var(--ink-3); font-size: 12px; }
.chip-foco.otra { background: var(--warn-bg); border-color: var(--warn); }
.b-ic { flex: none; width: 40px; height: 40px; display: grid; place-items: center; border: 1px solid var(--hair); border-radius: 20px; background: var(--surface); font-weight: 700; color: var(--ink-2); }
.b-ic:hover { color: var(--ink); border-color: var(--axis); }
.top-2 { display: flex; gap: 6px 8px; align-items: center; flex-wrap: wrap; padding-block: 0 8px; }
.corto { display: none; }
@media (max-width: 599px) { .largo { display: none; } .corto { display: inline; } .top h1 > span:not(.vh):not(.corto) { display: none; } }
.top-2::-webkit-scrollbar { display: none; }
.seg { display: inline-flex; flex: none; border: 1px solid var(--axis); border-radius: 18px; padding: 2px; background: var(--surface); }
.seg button { border: 0; background: none; min-height: 32px; padding: 0 11px; border-radius: 15px; font-size: 13px; color: var(--ink-2); white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--surface); font-weight: 600; }
.lbl { font-size: 12px; color: var(--ink-3); flex: none; }
.anclas { display: flex; flex-wrap: wrap; gap: 6px; padding-block: 10px 2px; }
.anclas::-webkit-scrollbar { display: none; }
.anclas a { flex: none; display: inline-flex; align-items: center; min-height: 32px; padding: 0 12px; border: 1px solid var(--hair); border-radius: 16px;
  font-size: 13px; color: var(--ink-2); background: var(--surface); text-decoration: none; }
.anclas a:hover { color: var(--ink); border-color: var(--axis); }

/* Contenido */
main { padding-block: 6px 48px; }
.estado { font-size: 13px; color: var(--ink-2); margin: 6px 0 10px; }
.estado b { color: var(--ink); font-weight: 600; }
section.sec { scroll-margin-top: calc(env(safe-area-inset-top, 0px) + var(--head-h) + 12px); margin-top: 28px; display: grid; gap: 12px; }
section.sec:first-of-type { margin-top: 4px; }
.sec-h { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 8px 12px; }
.sec-h h2 { font-size: 20px; margin: 0; letter-spacing: -.01em; text-wrap: balance; flex: 1 1 auto; }
.sec-h .ctl { display: flex; gap: 8px; flex-wrap: wrap; }
.sub { margin: 0; color: var(--ink-2); font-size: 14px; }
.grid { display: grid; gap: 12px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 720px) { .g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (min-width: 960px) { .g4 { grid-template-columns: 1.35fr 1fr 1fr 1fr; } .g21 { grid-template-columns: 2fr 1fr; } }
@media (min-width: 720px) and (max-width: 959px) { .g4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

.card { background: var(--surface); border: 1px solid var(--hair); border-radius: 14px; padding: 14px; position: relative; min-width: 0; display: grid; gap: 8px; align-content: start; }
.card > * { min-width: 0; max-width: 100%; }
section.sec > * { min-width: 0; }
.card h3 { margin: 0; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3); font-weight: 600; padding-right: 36px; }
.card .v { font-size: 28px; font-weight: 650; letter-spacing: -.02em; line-height: 1.1; }
.card.hero .v { font-size: 40px; }
@media (min-width: 960px) { .card.hero .v { font-size: 48px; } }
.card .l { font-size: 13px; color: var(--ink-2); }
.card .l b { color: var(--ink); font-weight: 600; }
.card.plano { background: none; border: 0; padding: 0; }
.cuenta { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; font-size: 13px; color: var(--ink-2); margin: 2px 0 0; }
.cuenta dt { margin: 0; } .cuenta dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; color: var(--ink); }
.cuenta .tot { border-top: 1px solid var(--hair); padding-top: 3px; font-weight: 600; color: var(--ink); }
.cuenta .ex { color: var(--ink-3); }

details.ayuda { position: absolute; top: 10px; right: 10px; }
details.ayuda > summary { width: 28px; height: 28px; border-radius: 14px; border: 1px solid var(--axis); display: grid; place-items: center; list-style: none;
  cursor: pointer; font-weight: 700; font-size: 13px; color: var(--ink-2); background: var(--surface); position: relative; }
details.ayuda > summary::after { content: ""; position: absolute; inset: -8px; }
details.ayuda > summary::-webkit-details-marker { display: none; }
details.ayuda[open] > summary { background: var(--ink); color: var(--surface); border-color: var(--ink); }
details.ayuda > div { position: absolute; right: 0; top: 34px; z-index: 6; width: min(320px, calc(100vw - 48px)); padding: 12px; border-radius: 10px;
  background: var(--surface); border: 1px solid var(--axis); box-shadow: 0 8px 24px var(--sombra); font-size: 13px; color: var(--ink-2); display: grid; gap: 6px; }
details.ayuda > div b { color: var(--ink); }
@media (max-width: 599px) { details.ayuda > div { position: fixed; left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); top: auto;
  bottom: calc(16px + env(safe-area-inset-bottom, 0px)); width: auto; max-height: 60vh; overflow-y: auto; z-index: 30; } }

.avisos { display: grid; gap: 6px; }
.aviso { display: flex; gap: 10px; align-items: flex-start; padding: 9px 12px; border-radius: 10px; background: var(--warn-bg); font-size: 13px; color: var(--ink); border: 0; text-align: left; width: 100%; }
.aviso.info { background: var(--info-bg); }
.aviso .ic { flex: none; font-weight: 700; width: 18px; text-align: center; color: var(--warn); }
.aviso.info .ic { color: var(--focus); }
.aviso .ir { flex: none; margin-left: auto; color: var(--ink-2); text-decoration: underline; text-underline-offset: 2px; white-space: nowrap; }

/* Gráficos */
.graf { position: relative; min-width: 0; }
.graf svg { display: block; width: 100%; height: auto; touch-action: pan-y; }
.graf svg:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 6px; }
.lectura { min-height: 40px; font-size: 13px; color: var(--ink-2); display: flex; flex-wrap: wrap; gap: 2px 10px; align-items: baseline; }
.lectura b { color: var(--ink); font-size: 15px; }
.lectura .k { color: var(--ink-3); }
.lectura button { border: 0; background: none; padding: 0; text-decoration: underline; text-underline-offset: 2px; color: var(--ink); font-size: 13px; min-height: 32px; }
.ley { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--ink-2); }
.ley span { display: inline-flex; align-items: center; gap: 6px; }
.sw { width: 12px; height: 12px; border-radius: 3px; display: inline-block; flex: none; }
.eje { font-size: 11px; fill: var(--ink-3); font-variant-numeric: tabular-nums; }
.rot { font-size: 11px; fill: var(--ink-2); font-variant-numeric: tabular-nums; }
.rot-f { font-size: 12px; fill: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
.mk { font-size: 10px; fill: var(--ink-3); }
.mk-w { font-size: 11px; fill: var(--warn); font-weight: 700; }

/* Tablas */
.tw { overflow-x: auto; min-width: 0; -webkit-overflow-scrolling: touch; }
table.t { border-collapse: collapse; width: 100%; font-size: 13px; }
table.t th, table.t td { padding: 7px 8px; border-bottom: 1px solid var(--hair); text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
table.t th { font-weight: 600; color: var(--ink-2); font-size: 12px; position: sticky; top: 0; background: var(--surface); }
table.t th:first-child, table.t td:first-child { text-align: left; }
table.t td.izq, table.t th.izq { text-align: left; white-space: normal; }
table.t tr.fila-click { cursor: pointer; }
table.t tr.fila-click:hover td { background: var(--surface-2); }
table.t tr.foco td { background: var(--info-bg); }
table.t tr.grupo td { background: var(--surface-2); font-weight: 600; color: var(--ink); }
table.t tfoot td { font-weight: 600; border-top: 1px solid var(--axis); }
.marcas { color: var(--ink-3); letter-spacing: .08em; }
.marcas .w { color: var(--warn); font-weight: 700; }
@media (max-width: 599px) { .solo-ancho { display: none; } }
details.vt > summary { cursor: pointer; font-size: 13px; color: var(--ink-2); min-height: 32px; display: inline-flex; align-items: center; text-decoration: underline; text-underline-offset: 2px; }
details.vt[open] > summary { margin-bottom: 6px; }

.link { border: 0; background: none; padding: 0; color: var(--ink); text-decoration: underline; text-underline-offset: 2px; font-size: inherit; min-height: 32px; }
.btn { border: 1px solid var(--axis); background: var(--surface); border-radius: 18px; min-height: 36px; padding: 0 14px; font-size: 13px; font-weight: 600; }
.btn:hover { border-color: var(--ink-3); }
.tag { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; padding: 1px 8px; border-radius: 10px; background: var(--surface-2); color: var(--ink-2); white-space: nowrap; }
.tag.w { background: var(--warn-bg); color: var(--ink); }
.tag.ok { background: var(--ok-bg); color: var(--ink); }

/* Barras horizontales (composición y cascada) */
.hb { display: grid; gap: 6px; }
.hb-f { display: grid; grid-template-columns: minmax(0, 9.5em) minmax(0, 1fr) auto; gap: 10px; align-items: center; font-size: 13px; }
.hb-f .n { color: var(--ink-2); overflow-wrap: anywhere; line-height: 1.25; }
.hb-f .n b { color: var(--ink); font-weight: 600; }
.hb-f .val { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; min-width: 5.5em; }
.hb-f .val small { color: var(--ink-3); }
.hb-pista { position: relative; height: 18px; }
.hb-pista .cero { position: absolute; top: -3px; bottom: -3px; width: 1px; background: var(--axis); }
.hb-pista .b { position: absolute; top: 3px; height: 12px; border-radius: 3px; background: var(--dato); }
.hb-pista .b.pos { background: var(--dato-foco); }
.hb-pista .b.aj { background: var(--dato-suave); }
.hb-f.tot .n, .hb-f.tot .val { font-weight: 650; color: var(--ink); }
@media (max-width: 420px) { .hb-f { grid-template-columns: minmax(0, 8.4em) minmax(0, 1fr) auto; gap: 8px; } .hb-f .val small.pct { display: block; text-align: right; } .hb-f .val { min-width: 4.5em; } }

/* Chequeos */
.chq { display: grid; gap: 8px; }
.chq-i { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 10px; padding: 10px 12px; border-radius: 10px; background: var(--surface); border: 1px solid var(--hair); font-size: 13px; }
.chq-i .tag { grid-row: span 2; align-self: start; }
.chq-i p { margin: 0; color: var(--ink-2); }
.chq-i b { font-weight: 600; }
.glos { display: grid; gap: 6px; }
.glos dl { margin: 0; display: grid; gap: 8px; }
.glos dt { font-weight: 600; }
.glos dd { margin: 0; color: var(--ink-2); font-size: 13px; }
.glos dd i { color: var(--ink-3); font-style: normal; }
input.buscar { width: 100%; min-height: 40px; padding: 0 12px; border: 1px solid var(--axis); border-radius: 10px; background: var(--surface); }

/* Panel de detalle y hojas */
.velo { position: fixed; inset: 0; background: var(--velo); z-index: 40; }
.panel { position: fixed; z-index: 41; background: var(--surface); box-shadow: 0 -8px 32px var(--sombra); display: flex; flex-direction: column;
  left: 0; right: 0; bottom: 0; max-height: 92vh; border-radius: 16px 16px 0 0; padding-bottom: env(safe-area-inset-bottom, 0px); }
@media (min-width: 960px) { .panel { left: auto; top: 0; bottom: 0; width: 460px; max-height: none; border-radius: 0; box-shadow: -8px 0 32px var(--sombra);
  padding-top: env(safe-area-inset-top, 0px); padding-right: env(safe-area-inset-right, 0px); } }
.panel-h { display: flex; align-items: center; gap: 6px; padding: 10px max(12px, env(safe-area-inset-left, 0px)); border-bottom: 1px solid var(--hair); }
.panel-h h2 { margin: 0; font-size: 17px; flex: 1; min-width: 0; }
.panel-h h2 small { display: block; font-size: 12px; font-weight: 400; color: var(--ink-3); }
.panel-c { overflow-y: auto; padding: 12px max(16px, env(safe-area-inset-left, 0px)) 24px; display: grid; gap: 16px; overscroll-behavior: contain; }
.panel-c h3 { margin: 0 0 6px; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3); }
.tres { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.tres div { background: var(--surface-2); border-radius: 10px; padding: 8px 10px; display: grid; gap: 2px; }
.tres span { font-size: 12px; color: var(--ink-3); }
.tres b { font-size: 16px; font-variant-numeric: tabular-nums; }
.lista-sem { display: grid; gap: 2px; }
.lista-sem button { display: flex; gap: 10px; align-items: center; width: 100%; border: 0; background: none; text-align: left; padding: 10px 6px; border-radius: 8px; min-height: 44px; }
.lista-sem button:hover, .lista-sem button[aria-current="true"] { background: var(--surface-2); }
.lista-sem .f { flex: 1; font-weight: 600; }
.lista-sem .m { color: var(--ink-3); font-size: 13px; }
.nota { font-size: 12px; color: var(--ink-3); margin: 0; }
.sel { min-height: 40px; border: 1px solid var(--axis); border-radius: 10px; background: var(--surface); padding: 0 8px; max-width: 100%; }
.fila-sel { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; font-size: 13px; }

.tw.fija table.t th:first-child, .tw.fija table.t td:first-child { position: sticky; left: 0; background: var(--surface); z-index: 1; }
.tw.fija table.t thead th:first-child { z-index: 2; }
.tw.fija table.t tr.foco td:first-child { background: linear-gradient(var(--info-bg), var(--info-bg)), var(--surface); }
@media (min-width: 700px) { .tw.alto { max-height: 70vh; } }
.caja-mon { display: block; font-size: 11.5px; color: var(--ink-3); }
.desliza { display: none; }
.nw { white-space: nowrap; }
tr.rep { display: none; }
@media (max-width: 699px) { tr.rep { display: table-row; } tr.rep td { font-size: 11.5px; color: var(--ink-3); background: var(--surface-2); font-weight: 600; } }
.fichas { display: grid; gap: 6px; }
.ficha { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; padding: 8px 10px; border-radius: 10px; background: var(--surface-2); }
.ficha b { font-variant-numeric: tabular-nums; text-align: right; }
.ficha small { grid-column: 1 / -1; color: var(--ink-3); font-size: 12px; font-variant-numeric: tabular-nums; }
.ficha.tot { background: none; border-top: 1px solid var(--axis); border-radius: 0; }
.tw.fija.mas { -webkit-mask-image: linear-gradient(to right, #000 calc(100% - 32px), transparent); mask-image: linear-gradient(to right, #000 calc(100% - 32px), transparent); }
@media (max-width: 599px) { table.t th, table.t td { padding: 6px 6px; font-size: 12.5px; } }
@media (max-width: 699px) { .tw.fija table.t td:first-child, .tw.fija table.t th:first-child { white-space: normal; min-width: 5.5em; max-width: 8.5em; } }
@media (min-width: 600px) { .hb-f { grid-template-columns: minmax(0, 13em) minmax(0, 1fr) auto; } }
@media (max-width: 699px) { .desliza { display: block; } }
button.orden { border: 0; background: none; padding: 0; font: inherit; color: inherit; font-weight: 600; min-height: 28px; cursor: pointer; text-align: inherit; }
button.orden:hover { color: var(--ink); text-decoration: underline; }
.chips { display: inline-flex; flex-wrap: wrap; gap: 4px; margin-left: 4px; vertical-align: middle; }
.chip-s { border: 1px solid var(--hair); background: var(--surface); border-radius: 12px; font-size: 12px; min-height: 26px; padding: 0 8px; color: var(--ink-2); }
.chip-s:hover { border-color: var(--axis); color: var(--ink); }
.det { display: grid; gap: 16px; min-width: 0; }
.det > * { min-width: 0; }
.panel-c > * { min-width: 0; }
.halo { paint-order: stroke; stroke: var(--surface); stroke-width: 3px; stroke-linejoin: round; }
main .top-2 { margin-top: 6px; }
.aviso .link.ir { margin-left: auto; }
.aviso .link { min-height: 0; }
.secc { display: grid; gap: 2px; }
.secc button { display: flex; width: 100%; border: 0; background: none; text-align: left; padding: 12px 8px; border-radius: 8px; min-height: 44px; font-weight: 600; }
.secc button:hover { background: var(--surface-2); }
@media (prefers-reduced-motion: no-preference) { .panel { animation: sube .18s ease-out; } @keyframes sube { from { transform: translateY(12px); opacity: .6; } } }
</style>

<header class="top gut" id="top">
  <div class="in">
    <div class="top-1">
      <h1><span class="vh">Tablero </span>Value <span>· Cambio General</span><span class="corto"> CG</span></h1>

function filtros() {
  const pres = [["todo", "Todo", "Todo"], ["3m", "Últimos 3 meses", "3 meses"], ["8s", "Últimas 8 semanas", "8 semanas"]];
  const f = h("div", { class: "top-2", id: "filtros" },
    h("span", { class: "lbl" }, "Período"),
    h("div", { class: "seg", role: "group", "aria-label": "Período" },
      pres.map(([v, t, c]) => h("button", { type: "button", "aria-pressed": String(ST.periodo === v), onclick: () => { ST.periodo = v; guardar("periodo", v); ST.foco = W.length - 1; aplicarPeriodo(); render(true); } }, h("span", { class: "largo" }, t), h("span", { class: "corto" }, c))),
      h("button", { type: "button", "aria-pressed": String(ST.periodo === "elegido"), onclick: abrirPeriodo }, ST.periodo === "elegido" ? `${W[ST.desde].txt} → ${W[ST.hasta].txt}` : "Elegir…")),
    h("span", { class: "lbl" }, "Ganancia"),
    seg("s-aj", [[false, "Sin ajustes"], [true, "Con ajustes"]], ST.aj, v => { ST.aj = v; guardar("aj", v); render(true); }, "Ajustes a mano"));
  const s = W[ST.foco];
  document.getElementById("b-foco").replaceChildren(h("small", {}, "Semana"), h("span", {}, s.txt.replace(" (2 sem.)", "")), h("span", { "aria-hidden": "true" }, "▾"));
  document.getElementById("b-foco").classList.toggle("otra", ST.foco !== W.length - 1);
  return f;
}
function render(conservarScroll) {
  const y = window.scrollY;
  app.replaceChildren(
    filtros(),
    h("nav", { class: "anclas", "aria-label": "Secciones" }, SECCIONES
      .map(([id, t, c]) => h("a", { href: "#" + id, onclick: e => { e.preventDefault(); irSeccion(id); } }, h("span", { class: "largo" }, t), h("span", { class: "corto" }, c)))),
    resumen(), seccionGanancia(), seccionPlata(), seccionGastos(), seccionSocios(), seccionSemanas(), seccionCreo());
  requestAnimationFrame(() => { dibujarTodo(); document.querySelectorAll(".tw.fija").forEach(marcarMas); if (conservarScroll) window.scrollTo(0, y); });
}
document.getElementById("b-foco").addEventListener("click", abrirListaSemanas);
document.getElementById("b-ayuda").addEventListener("click", abrirAyuda);
document.getElementById("b-secc").addEventListener("click", abrirSecciones);
render();
const m0 = /^#semana-(\d{4}-\d{2}-\d{2})$/.exec(location.hash);
if (m0 && IDX[m0[1]] !== undefined) abrirSemana(IDX[m0[1]]);
else if (/^#(resumen|ganancia|plata|gastos|socios|semanas|creo)$/.test(location.hash)) requestAnimationFrame(() => document.querySelector(location.hash)?.scrollIntoView());
</script>
